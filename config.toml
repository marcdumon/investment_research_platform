[providers.stooq]
raw_dir = "stooq/raw"
processed_dir = "stooq/processed"

# Stooq bulk data download
bulk_url = "http://stooq.com/db/h/"
bulk_files = ["d_us_txt.zip", "d_world_txt.zip"]
bulk_instruction_template = """

The bulk historical price data is available for free download on the 
stooq website at {bulk_url}.
Manually download
- the US, Daily, Ascii file: `{bulk_files[0]}`
- the World, Daily, Ascii file: `{bulk_files[1]}`
and place them in the raw data directory.
"""

# Stooq update data download
update_url = "http://stooq.com/db/"
update_file = "data_d.txt"
update_instruction_template = """ 
The daily price updates are available for free download on the
stooq website at {update_url}. 
Manually download:
- click on `Setting Files Content`:
    - click `World` and `U.S.` to download all these markets
    - click `Save configuration` and then `Close`
- select the update days or the full month by clicking `All days Select` at the left bottom of the table
- click `N_d` to download the update file named `data_d.txt`
- place the update file `data_d.txt` in the raw data directory
"""
