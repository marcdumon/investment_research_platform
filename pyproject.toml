[project]
name = "investment-research-platform"
version = "0.1.0"
description = "Personal investment research platform - data pipeline and analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.10.0",
    "dash>=4.1.0",
    "duckdb>=1.5.2",
    "hmmlearn>=0.3.3",
    "ipyevents>=2.0.4",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=6.7.0",
    "polars>=1.20.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "questionary>=2.0.0",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "simfin>=1.0.2",
    "statsmodels>=0.14.2",
    "TA-Lib>=0.4.0",
    "yfinance>=1.3.0"
]

[project.scripts]
irp = "irp.cli:main"
irp-ui = "irp.ui.server:run_server"
dataload = "dataload.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["irp*", "dataload*"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: hits real external APIs (requires API keys)"
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13"
]
