[project]
name = "investment-research-platform"
version = "0.1.0"
description = "Personal investment research platform - data pipeline and analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.10.0",
    "duckdb>=1.5.2",
    "ipyevents>=2.0.4",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "simfin>=1.0.2",
    "yfinance>=1.3.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.2",
    "pydantic>=2.13.4",
    "questionary>=2.0.0",
    "pyarrow>=24.0.0",
    "dash>=4.1.0",
    "polars>=1.20.0",
    "TA-Lib>=0.4.0",
    "hmmlearn>=0.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
irp = "irp.cli:main"
irp-ui = "irp.ui.server:run_server"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["irp*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import sort, UP pyupgrade, B bugbear, SIM simplify.
# E501 (line length) ignored: the codebase uses long dense lines deliberately.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
python_version = "3.13"
# Type-checked surface (the well-typed pure layers). UI/ingest/pandas-heavy
# modules are not gated yet — expand the package list as they are annotated.
packages = ["irp.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
markers   = ["integration: hits real external APIs (requires API keys)"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
