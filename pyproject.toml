[project]
name = "investment-research-platform"
version = "0.1.0"
description = "Personal investment research platform - data pipeline and analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.10.0",
    "duckdb>=1.5.2",
    "ipyevents>=2.0.4",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "simfin>=1.0.2",
    "yfinance>=1.3.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.2",
    "pydantic>=2.13.4",
    "questionary>=2.0.0",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
irp         = "irp.cli:main"
irp-catalog = "irp.data.catalog:main"
irp-migrate = "irp.data.migrations:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["irp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
markers   = ["integration: hits real external APIs (requires API keys)"]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
